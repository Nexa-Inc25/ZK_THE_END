version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zkflow}
      POSTGRES_DB: ${POSTGRES_DB:-zkflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  pgdata:
